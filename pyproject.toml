[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "minecraft-broadcaster"
version = "0.1.0"
description = "Send Minecraft LAN server announcements over IPv4 multicast."
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.11",
]

[project.scripts]
minecraft-broadcaster = "broadcast:main"

[tool.setuptools]
py-modules = ["broadcast"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
